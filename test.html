<!DOCTYPE html>
<html>
<head>
    <title>Test GitHub Pages</title>
</head>
<body>
    <h1>Test funziona!</h1>
    <script>
        console.log('Base URL:', window.location.href);
        fetch('/goldengoose/data/products.json')
            .then(r => r.json())
            .then(data => {
                console.log('Products loaded:', data.length);
                document.body.innerHTML += '<p>Prodotti caricati: ' + data.length + '</p>';
            })
            .catch(err => {
                console.error('Error:', err);
                document.body.innerHTML += '<p style="color:red">Errore: ' + err.message + '</p>';
            });
    </script>
</body>
</html>
